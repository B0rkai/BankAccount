# The live web service. Started by deploy.sh, which builds the image and sets the variables below.
name: bankaccount

services:
  app:
    image: bankaccount:live
    # Runs as the server's user, who owns the database folder.
    user: "${BANKACCOUNT_UID:?}:${BANKACCOUNT_GID:?}"
    # 8300: only `tailscale serve` (svc:persely) may reach it, as its identity headers are
    # trusted there. 8400: the home LAN (the server's LAN address only, never 0.0.0.0), where
    # those headers are ignored and the shared password signs in.
    ports:
      - "127.0.0.1:${BANKACCOUNT_TAILNET_PORT:-8300}:8300"
      - "${BANKACCOUNT_LAN_ADDRESS:?}:${BANKACCOUNT_LAN_PORT:-8400}:8400"
      # The LAN page over HTTPS (deploy/lan-tls.sh), where Windows Hello unlocks editing.
      - "${BANKACCOUNT_LAN_ADDRESS:?}:${BANKACCOUNT_LAN_TLS_PORT:-8443}:8443"
    # BANKACCOUNT_ALLOWED_LOGINS and BANKACCOUNT_LAN_PASSWORD_HASH - written by deploy/set-secrets.sh.
    env_file: "${BANKACCOUNT_ENV_FILE:?}"
    environment:
      BANKACCOUNT_DB: "/data/${BANKACCOUNT_DB_FILE:?}"
      # Scheduled bank fetches run at 6:00 local time (daemon/AccountSettings.h).
      TZ: Europe/Budapest
    volumes:
      # Persely's SQLite database (deploy/migrate-db.sh), written as changes are made in Persely.
      # A whole folder: SQLite keeps a short-lived -journal file next to the database during a
      # write, and a refreshed file renamed over the old one shows up inside.
      - "${BANKACCOUNT_DB_DIR:?}:/data"
      # Daily snapshots of it (Backups.h).
      - "${BANKACCOUNT_BACKUP_DIR:?}:/backup"
      # The web app's own favorites (favorite_queries.json/favorite_reports.json) and settings
      # (web_settings.json), writable. A whole
      # folder rather than the two files: saving renames a new file over the old one, which a
      # single-file mount refuses.
      - "${BANKACCOUNT_FAVORITES_DIR:?}:/app/db"
      # The Enable Banking app's config.json and private key (bank connections - see
      # docs/linux-daemon-deployment.md); an empty folder leaves them off.
      - "${BANKACCOUNT_ENABLEBANKING_DIR:?}:/app/enablebanking:ro"
      # The HTTPS LAN page's certificate and key, and the authority's certificate for
      # /persely-ca.crt - from the server's shared ~/.config/lan-tls (deploy/lan-tls.sh), one file at
      # a time so the authority's key stays out; /dev/null: no HTTPS page. The daemon reads them
      # when it starts, so a renewed certificate needs a restart (deploy.sh).
      - "${BANKACCOUNT_LAN_TLS_CA:?}:/app/lan-tls/ca.crt:ro"
      - "${BANKACCOUNT_LAN_TLS_CERT:?}:/app/lan-tls/server.crt:ro"
      - "${BANKACCOUNT_LAN_TLS_KEY:?}:/app/lan-tls/server.key:ro"
    restart: unless-stopped
